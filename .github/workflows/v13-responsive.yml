name: V13 responsive browser validation
on:
  push:
    branches: [test/v13-browser-validation]
  workflow_dispatch:
jobs:
  chromium-responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p test-results && node tests/v13-responsive.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-browser-screenshots
          path: test-results/
