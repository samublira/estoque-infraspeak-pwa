name: Build native PWA icons
on:
  push:
    branches: [main]
    paths:
      - 'infraspeak-stock-icon.svg'
      - '.github/workflows/build-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render native PNG icons from vector
        run: |
          pip install cairosvg
          python - <<'PY'
          import cairosvg
          for name,size in [('icon-192.png',192),('icon-512.png',512),('apple-touch-icon.png',180),('icon-1024.png',1024)]:
              cairosvg.svg2png(url='infraspeak-stock-icon.svg',write_to=name,output_width=size,output_height=size)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png apple-touch-icon.png icon-1024.png
          git diff --cached --quiet || (git commit -m "assets: gerar PNGs nativos de alta resolucao para Android e iOS" && git push)
